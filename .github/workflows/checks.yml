name: School project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  moonname:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java/moonname
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sh mvnw --batch-mode verify
  mediatheque:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java/mediatheque
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: javac -encoding UTF-8 -d build @sources.txt
      - run: printf '0\n' | java -cp build Main | grep 'Au revoir'
  csharp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - 'csharp/heroes-vs-monsters/src/HvM 2.0.csproj'
          - 'csharp/2048-game/2048 game.csproj'
          - 'csharp/bank-account/ExoCompteCourant.csproj'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build "${{ matrix.project }}" --configuration Release
